# Government sites get redesigned; this catches a report link that broke
# before a resident (or a judge) finds it. Free on public repositories.
name: Check report links

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays, 9 a.m. Eastern
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-links.mjs
