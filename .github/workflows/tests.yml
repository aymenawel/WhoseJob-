# Every push runs the tests, the routing-rule checks inside them, types and lint,
# so a broken rule or screen shows up as a red X on GitHub, not on the live site.
# Free on public repositories.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Route types (LayoutProps and friends) are generated, not committed.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
